# Required: MySQL 8 server and an existing schema shared by Core and PalaceBungee.
mysql:
  host: ''
  port: 3306
  database: palace
  username: ''
  password: ''
  ssl-mode: PREFERRED
server-type: Unknown
instance-name: ServerName
dashboardURL: ws://socket.dashboard.playground.palace.network:7892
isDefaultSidebarEnabled: true
debug: false
dashboardAndSqlDisabled: false
isGameMode: false
showTitle: false
loginTitle: ""
loginSubtitle: ""
loginFadeIn: 20
loginStay: 100
loginFadeOut: 20
